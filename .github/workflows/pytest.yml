name: Run Pytest on Pull Request
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run unit tests
        env:
          # Distinct data-file name so this suite's coverage doesn't collide with
          # the integration suite's when both artifacts are downloaded together in
          # the coverage job. `coverage combine` merges any `.coverage.*` file.
          COVERAGE_FILE: .coverage.unit
        run: pytest -v -m "not integration" --cov=smtpbench --cov-report= --cov-fail-under=0
      - name: Upload unit coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          retention-days: 1

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Pull mail server image
        run: docker pull ghcr.io/lets-qa/local-test-mail-server:main
      - name: Run integration tests
        env:
          # Distinct data-file name (see unit-tests job) so the two suites' coverage
          # files coexist in the coverage job and both get combined.
          COVERAGE_FILE: .coverage.integration
        run: pytest -v -m "integration" --cov=smtpbench --cov-report= --cov-fail-under=0 --tb=short
      - name: Upload integration coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          retention-days: 1
      - name: Fix permissions for artifact upload
        if: always()
        run: |
          sudo chmod -R 755 test-mail/ logs/ 2>/dev/null || true
          sudo chmod 644 test-mail/root 2>/dev/null || true
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            logs/
            test-mail/
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
      - name: Download integration coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
      - name: Per-suite report (informational)
        run: |
          echo "== Unit-only coverage =="
          coverage report --data-file=.coverage.unit || true
          echo "== Integration-only coverage =="
          coverage report --data-file=.coverage.integration || true
      - name: Combined coverage gate
        run: |
          # Merge both suites' data files (.coverage.unit + .coverage.integration)
          # into a single .coverage, then apply the fail_under gate from pyproject.
          coverage combine .coverage.unit .coverage.integration
          coverage report
