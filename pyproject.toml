[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smtpbench"
version = "1.2.0"
description = "A robust SMTP load testing and benchmarking tool with MX failover and detailed logging"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Randall Morse", email = "rmorse@lets.qa"}
]
maintainers = [
    {name = "Randall Morse", email = "rmorse@lets.qa"}
]
keywords = ["smtp", "email", "load-testing", "testing", "performance", "benchmark", "benchmarking"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "dnspython>=2.0.0",
    "tqdm>=4.0.0",
    "colorama>=0.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0",
    "ruff==0.16.1",
]

[project.urls]
Homepage = "https://github.com/SMTPBench/SMTPBench"
Documentation = "https://github.com/SMTPBench/SMTPBench#readme"
Repository = "https://github.com/SMTPBench/SMTPBench"
Issues = "https://github.com/SMTPBench/SMTPBench/issues"

[project.scripts]
smtpbench = "smtpbench.cli:main"

[tool.setuptools]
packages = ["smtpbench"]

[tool.ruff]
target-version = "py38"
line-length = 100
exclude = ["docs/"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, UP: pyupgrade.
# E501 (line length) is left to the formatter, which owns wrapping.
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["smtpbench"]
parallel = true
omit = ["smtpbench/__main__.py"]

[tool.coverage.report]
# Provisional floor: set below locally-measurable unit-only coverage (62%) because
# Docker was unavailable to measure the combined number. CI computes the authoritative
# combined coverage; ratchet this up toward the combined total after the first CI run.
fail_under = 60
show_missing = true
